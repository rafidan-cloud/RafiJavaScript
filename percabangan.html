<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Login Diskon</title>

<style>
:root{
  --bg:#f3f3f3;
  --card:#ffffff;
  --text:#222;
  --accent:#9e9e9e;
}
.dark{
  --bg:#121212;
  --card:#1f1f1f;
  --text:#f1f1f1;
  --accent:#888;
}

*{
  font-family:Arial, sans-serif;
  box-sizing:border-box;
}

body{
  margin:0;
  height:100vh;
  background:var(--bg);
  display:flex;
  justify-content:center;
  align-items:center;
  color:var(--text);
  overflow:hidden;
}

/* TOMBOL KEMBALI */
.back{
  position:fixed;
  top:20px;
  left:20px;
  padding:8px 16px;
  border-radius:20px;
  background:rgba(0,0,0,0.6);
  color:#fff;
  text-decoration:none;
  font-size:14px;
  transition:0.3s;
  z-index:1000;
}

.back:hover{
  background:#000;
}

.dark .back{
  background:rgba(255,255,255,0.2);
}

.dark .back:hover{
  background:rgba(255,255,255,0.4);
}

/* CARD */
.card{
  width:360px;
  padding:25px;
  border-radius:25px;
  background:var(--card);
  box-shadow:0 10px 30px rgba(0,0,0,.2);
}

/* INPUT */
input{
  width:100%;
  padding:14px;
  margin-top:12px;
  border:none;
  border-radius:25px;
  background:#eaeaea;
}
input:focus{
  outline:none;
  transform:scale(1.03);
}

/* BUTTON */
button{
  width:100%;
  margin-top:12px;
  padding:14px;
  border:none;
  border-radius:25px;
  background:var(--accent);
  color:white;
  font-weight:bold;
}
button:hover{ transform:scale(1.05); }

/* SWITCH */
.switch{
  position:fixed;
  top:20px;
  right:20px;
}
.switch input{display:none;}
.slider{
  width:50px;
  height:26px;
  background:#aaa;
  border-radius:20px;
  position:relative;
}
.slider::before{
  content:"";
  width:22px;
  height:22px;
  background:white;
  position:absolute;
  top:2px;
  left:2px;
  border-radius:50%;
  transition:.3s;
}
.switch input:checked + .slider::before{
  transform:translateX(24px);
}

/* PARTICLE */
.particle{
  position:fixed;
  width:6px;
  height:6px;
  background:rgba(0,0,0,.4);
  border-radius:50%;
  pointer-events:none;
  animation:fade .8s forwards;
}
.dark .particle{
  background:rgba(255,255,255,.6);
}
@keyframes fade{
  to{opacity:0;transform:scale(2);}
}
</style>
</head>

<body>

<!-- TOMBOL KEMBALI -->
<a href="index.html" class="back">⬅ Kembali</a>

<label class="switch">
  <input type="checkbox" onclick="mode()">
  <div class="slider"></div>
</label>

<div class="card">
  <h2 align="center">Login</h2>
  <input id="user" placeholder="Username">
  <input id="pass" type="password" placeholder="Password">
  <button onclick="login()">Login</button>
  <div id="hasil"></div>
</div>

<script>
var USER = "rafi";
var PASS = "123";

/* PARTICLE */
document.addEventListener("mousemove",function(e){
  var p=document.createElement("div");
  p.className="particle";
  p.style.left=e.clientX+"px";
  p.style.top=e.clientY+"px";
  document.body.appendChild(p);
  setTimeout(function(){p.remove();},800);
});

function login(){
  if(user.value!==USER){
    hasil.innerText="Username salah";
  }
  else if(pass.value!==PASS){
    hasil.innerText="Password salah";
  }
  else{
    bukaTabKedua();
  }
}

function bukaTabKedua(){
  var w = window.open("", "_blank");

  w.document.open();
  w.document.write(`
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Hitung Diskon</title>
<style>
:root{
  --bg:#f3f3f3;
  --card:#ffffff;
  --text:#222;
  --accent:#777;
  --total:#666;
}
.dark{
  --bg:#121212;
  --card:#1f1f1f;
  --text:#f1f1f1;
  --total:#cccccc;
}
*{font-family:Arial;}
body{
  margin:0;
  height:100vh;
  background:var(--bg);
  display:flex;
  justify-content:center;
  align-items:center;
  color:var(--text);
}
.card{
  width:380px;
  padding:30px;
  border-radius:30px;
  background:var(--card);
}
input,button{
  width:100%;
  padding:14px;
  margin-top:12px;
  border:none;
  border-radius:25px;
}
button{
  background:var(--accent);
  color:white;
  font-weight:bold;
}
.result{
  margin-top:15px;
  padding:15px;
  border-radius:20px;
  background:rgba(0,0,0,.05);
}
.total{
  font-size:18px;
  font-weight:bold;
  color:var(--total);
}
</style>
</head>

<body>

<div class="card">
  <h2 align="center">Hitung Diskon</h2>
  <input id="tb" type="number" placeholder="Total Bayar">
  <button onclick="hitung()">Hitung</button>
  <button onclick="window.close()">Kembali</button>
  <div id="hasil"></div>
</div>

<script>
function rupiah(n){
  return n.toLocaleString("id-ID");
}

function hitung(){
  var tb=Number(document.getElementById("tb").value);
  var d=0;

  if(tb>=1000000)d=0.20;
  else if(tb>=850000)d=0.15;
  else if(tb>=750000)d=0.10;
  else if(tb>=500000)d=0.05;

  var pot=tb*d;
  var total=tb-pot;

  hasil.innerHTML=
    "<div class='result'>"+
    "Total: Rp "+rupiah(tb)+"<br>"+
    "Diskon: "+(d*100)+"%<br>"+
    "Potongan: Rp "+rupiah(pot)+"<br>"+
    "<span class='total'>Total Bayar: Rp "+rupiah(total)+"</span>"+
    "</div>";
}
<\/script>

</body>
</html>
`);
  w.document.close();
}

function mode(){
  document.body.classList.toggle("dark");
}
</script>

</body>
</html>
