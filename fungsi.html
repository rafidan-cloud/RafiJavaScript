<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kalkulator Bangun Ruang Pro</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
:root{
  --bg1:#f7f3ee;
  --bg2:#eef3ef;
  --card:rgba(255,255,255,0.7);
  --text:#1f2a24;
  --muted:#6b7a72;
  --border:rgba(0,0,0,0.08);
  --accent:#6d8b74;
  --accent2:#8fae9a;
  --shadow:0 20px 50px rgba(0,0,0,0.10);
}

body.dark{
  --bg1:#0c1411;
  --bg2:#0f1b17;
  --card:rgba(18,28,24,0.75);
  --text:#e7efe9;
  --muted:#a6b6ad;
  --border:rgba(255,255,255,0.08);
  --accent:#9fb8ad;
  --accent2:#7f9c90;
  --shadow:0 25px 60px rgba(0,0,0,0.6);
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

body{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(135deg,var(--bg1),var(--bg2));
  transition:.6s ease;
  padding:20px;
}

.back{
  position:fixed;
  top:18px;
  left:18px;
  padding:10px 14px;
  border-radius:14px;
  text-decoration:none;
  color:var(--text);
  background:var(--card);
  border:1px solid var(--border);
  box-shadow:var(--shadow);
  backdrop-filter:blur(10px);
  transition:.3s;
  font-size:13px;
}

.back:hover{
  transform:translateY(-2px);
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:white;
}

.container{
  width:420px;
  max-width:95%;
  padding:28px;
  border-radius:24px;
  background:var(--card);
  border:1px solid var(--border);
  box-shadow:var(--shadow);
  color:var(--text);
  text-align:center;
  backdrop-filter:blur(14px);
  animation:enter .7s cubic-bezier(.2,.9,.2,1);
  position:relative;
  overflow:hidden;
}

.container::before{
  content:"";
  position:absolute;
  inset:-50%;
  background:radial-gradient(circle at 30% 30%, rgba(109,139,116,0.12), transparent 60%),
              radial-gradient(circle at 70% 70%, rgba(143,174,154,0.10), transparent 65%);
  animation:floatGlow 8s ease-in-out infinite alternate;
}

@keyframes floatGlow{
  from{transform:translateY(-10px)}
  to{transform:translateY(12px)}
}

@keyframes enter{
  from{opacity:0; transform:translateY(16px) scale(.98)}
  to{opacity:1; transform:translateY(0) scale(1)}
}

h2{
  font-size:18px;
  margin-bottom:14px;
  font-weight:600;
  position:relative;
  z-index:1;
}

.toggle{
  cursor:pointer;
  font-size:12px;
  color:var(--muted);
  margin-bottom:14px;
  display:inline-flex;
  gap:6px;
  padding:6px 10px;
  border-radius:12px;
  border:1px solid var(--border);
  transition:.3s;
  position:relative;
  z-index:1;
}

.toggle:hover{
  color:var(--accent);
  transform:translateY(-2px);
}

select,input{
  width:100%;
  padding:11px;
  margin-top:8px;
  border-radius:14px;
  border:1px solid var(--border);
  background:rgba(255,255,255,0.6);
  outline:none;
  transition:.3s;
  font-size:14px;
  position:relative;
  z-index:1;
}

body.dark select,
body.dark input{
  background:rgba(255,255,255,0.04);
  color:var(--text);
}

button{
  width:100%;
  padding:12px;
  margin-top:12px;
  border:none;
  border-radius:16px;
  cursor:pointer;
  font-weight:500;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:white;
  transition:.25s ease;
  position:relative;
  overflow:hidden;
  z-index:1;
}

button:hover{
  transform:translateY(-3px);
}

#hasil{
  margin-top:16px;
  padding:16px;
  border-radius:18px;
  border:1px solid var(--border);
  background:rgba(255,255,255,0.6);
  min-height:60px;
  font-size:14px;
  opacity:0;
  transform:translateY(10px);
  transition:.4s;
  position:relative;
  z-index:1;
}

body.dark #hasil{
  background:rgba(255,255,255,0.04);
}

#hasil.show{
  opacity:1;
  transform:translateY(0);
}

.rumus{
  font-size:12px;
  color:var(--muted);
  margin-bottom:6px;
}
</style>

<script>
function tampilkan(teks){
  var hasil=document.getElementById("hasil");
  hasil.innerHTML=teks;
  hasil.classList.add("show");
}

function hitung(){
  var jenis=document.getElementById("jenis").value;
  var r=parseFloat(document.getElementById("r").value);
  var t=parseFloat(document.getElementById("t").value);

  if(jenis=="kerucutV"){
    var v=(1/3)*Math.PI*r*r*t;
    tampilkan("<div class='rumus'>V = 1/3 π r² t</div>Volume = "+v.toFixed(2));
  }
  else if(jenis=="bolaL"){
    var l=4*Math.PI*r*r;
    tampilkan("<div class='rumus'>L = 4 π r²</div>Luas = "+l.toFixed(2));
  }
  else if(jenis=="bolaV"){
    var v=(4/3)*Math.PI*r*r*r;
    tampilkan("<div class='rumus'>V = 4/3 π r³</div>Volume = "+v.toFixed(2));
  }
  else if(jenis=="kubus"){
    var v=r*r*r;
    tampilkan("<div class='rumus'>V = s³</div>Volume = "+v.toFixed(2));
  }
  else if(jenis=="kerucutL"){
    var l=Math.PI*r*(r+t);
    tampilkan("<div class='rumus'>L = π r (r+s)</div>Luas = "+l.toFixed(2));
  }
}

function toggleMode(){
  document.body.classList.toggle("dark");
}
</script>

</head>
<body>

<a class="back" href="index.html">← Kembali</a>

<div class="container">

  <div class="toggle" onclick="toggleMode()">🌙 / ☀️ Mode</div>

  <h2>Kalkulator Bangun Ruang</h2>

  <select id="jenis">
    <option value="kerucutV">Kerucut Volume</option>
    <option value="bolaL">Bola Luas</option>
    <option value="bolaV">Bola Volume</option>
    <option value="kubus">Kubus Volume</option>
    <option value="kerucutL">Kerucut Luas</option>
  </select>

  <input type="number" id="r" placeholder="Jari-jari / Sisi">
  <input type="number" id="t" placeholder="Tinggi / Pelukis">

  <button onclick="hitung()">Hitung</button>

  <div id="hasil">Hasil akan tampil di sini...</div>

</div>

</body>
</html>
