<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jendela Dialog JS</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
:root{
    --bg:#f6f8fc;
    --card:#ffffff;
    --text:#1f2937;
    --muted:#6b7280;
    --border:#e6eaf2;
    --accent:#5b6b8c;
    --shadow:0 20px 50px rgba(0,0,0,0.08);
}

body.dark{
    --bg:#0b1220;
    --card:#0f172a;
    --text:#e5e7eb;
    --muted:#9ca3af;
    --border:#1f2937;
    --accent:#93a4c7;
    --shadow:0 20px 50px rgba(0,0,0,0.6);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:var(--bg);
    transition:background .6s ease, color .6s ease;
    padding:20px;
}

.container{
    width:430px;
    max-width:95%;
    padding:30px;
    border-radius:24px;
    background:var(--card);
    border:1px solid var(--border);
    box-shadow:var(--shadow);
    color:var(--text);
    text-align:center;
    position:relative;
    overflow:hidden;
    animation:enter .6s cubic-bezier(.2,.9,.2,1);
}

/* soft animated glow background */
.container::before{
    content:"";
    position:absolute;
    inset:-50%;
    background:radial-gradient(circle at 30% 30%, rgba(91,107,140,0.10), transparent 55%),
                radial-gradient(circle at 70% 70%, rgba(147,164,199,0.08), transparent 60%);
    animation:floatGlow 10s ease-in-out infinite alternate;
}

@keyframes floatGlow{
    from{transform:translateY(-10px) scale(1)}
    to{transform:translateY(10px) scale(1.02)}
}

@keyframes enter{
    from{opacity:0; transform:translateY(14px) scale(.98)}
    to{opacity:1; transform:translateY(0) scale(1)}
}

h1{
    font-size:19px;
    font-weight:600;
    margin-bottom:10px;
    position:relative;
    z-index:1;
}

.toggle{
    font-size:12px;
    cursor:pointer;
    color:var(--muted);
    margin-bottom:14px;
    display:inline-flex;
    align-items:center;
    gap:6px;
    padding:6px 12px;
    border-radius:12px;
    border:1px solid var(--border);
    transition:.3s;
    position:relative;
    z-index:1;
}

.toggle:hover{
    color:var(--accent);
    transform:translateY(-2px);
}

button{
    width:100%;
    padding:12px;
    margin-top:10px;
    border:none;
    border-radius:14px;
    cursor:pointer;
    font-weight:500;
    transition:all .25s cubic-bezier(.2,.8,.2,1);
    position:relative;
    z-index:1;
    overflow:hidden;
}

/* subtle shine effect */
button::after{
    content:"";
    position:absolute;
    top:0;
    left:-100%;
    width:100%;
    height:100%;
    background:linear-gradient(120deg,transparent,rgba(255,255,255,0.25),transparent);
    transition:.5s;
}

button:hover::after{
    left:100%;
}

.btn{
    background:var(--accent);
    color:white;
    box-shadow:0 10px 24px rgba(0,0,0,0.10);
}

.btn:hover{
    transform:translateY(-3px);
    filter:brightness(1.08);
}

.btn:active{
    transform:translateY(-1px) scale(.99);
}

.btn-back{
    background:transparent;
    border:1px solid var(--border);
    color:var(--text);
    margin-top:14px;
}

.btn-back:hover{
    background:linear-gradient(135deg,var(--accent),#8ea2d6);
    color:white;
    border-color:transparent;
    transform:translateY(-3px);
}

.output{
    margin-top:16px;
    padding:14px;
    border-radius:16px;
    border:1px solid var(--border);
    min-height:52px;
    font-size:14px;
    background:rgba(255,255,255,0.65);
    transition:all .35s ease;
    position:relative;
    z-index:1;
    backdrop-filter:blur(6px);
}

body.dark .output{
    background:rgba(255,255,255,0.03);
}

/* smooth pop animation */
.output.flash{
    animation:pop .35s cubic-bezier(.2,.9,.2,1);
}

@keyframes pop{
    0%{transform:scale(.97); opacity:.5}
    60%{transform:scale(1.01)}
    100%{transform:scale(1); opacity:1}
}

</style>
</head>
<body>

<div class="container">

    <div class="toggle" onclick="toggleMode()">🌙 / ☀️ Mode</div>

    <h1>Jendela Dialog JavaScript</h1>

    <button class="btn" onclick="inputNama()">Input Nama</button>
    <button class="btn" onclick="tampilAlert()">Alert</button>
    <button class="btn" onclick="tampilConfirm()">Confirm</button>

    <div class="output" id="output">Hasil akan muncul di sini...</div>

    <button class="btn-back" onclick="kembaliIndex()">← Kembali ke Index</button>

</div>

<script>
const output=document.getElementById('output');

function flash(){
    output.classList.remove('flash');
    void output.offsetWidth;
    output.classList.add('flash');
}

function inputNama(){
    let nama=prompt('Masukkan nama kamu:');
    output.innerHTML=nama?`Halo, ${nama} 👋`:'Tidak ada input.';
    flash();
}

function tampilAlert(){
    alert('Ini alert JavaScript');
    output.innerHTML='Alert sudah ditampilkan.';
    flash();
}

function tampilConfirm(){
    let jawab=confirm('Suka JavaScript?');
    output.innerHTML=jawab?'Jawaban: IYA 👍':'Jawaban: TIDAK 👎';
    flash();
}

function kembaliIndex(){
    window.location.href='index.html';
}

function toggleMode(){
    document.body.classList.toggle('dark');
}
</script>

</body>
</html>
