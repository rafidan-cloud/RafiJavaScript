<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dialog JavaScript</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

:root{
    --bg:#0f172a;
    --card:#111827;
    --card2:#1e293b;
    --text:#f8fafc;
    --sub:#94a3b8;
    --border:rgba(255,255,255,0.08);
    --accent:#4f8cff;
}

body.light{
    --bg:#f4f7fb;
    --card:#ffffff;
    --card2:#f8fafc;
    --text:#0f172a;
    --sub:#64748b;
    --border:#e2e8f0;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Inter',sans-serif;
}

body{
    min-height:100vh;
    background:var(--bg);
    color:var(--text);

    display:flex;
    justify-content:center;
    align-items:center;

    padding:20px;

    transition:.3s;
}

/* CARD */

.container{
    width:100%;
    max-width:430px;

    background:linear-gradient(180deg,var(--card),var(--card2));

    border:1px solid var(--border);

    border-radius:32px;

    padding:22px;

    box-shadow:
    0 20px 60px rgba(0,0,0,0.25);

    position:relative;
}

/* TOP */

.top{
    display:flex;
    justify-content:space-between;
    align-items:center;

    margin-bottom:28px;
}

.title{
    font-size:22px;
    font-weight:700;
    letter-spacing:-0.5px;
}

.mode{
    width:46px;
    height:46px;

    border-radius:16px;

    border:1px solid var(--border);

    background:rgba(255,255,255,0.03);

    display:flex;
    justify-content:center;
    align-items:center;

    cursor:pointer;

    transition:.25s;
}

.mode:hover{
    transform:translateY(-3px);
}

/* BUTTON */

.group{
    display:flex;
    flex-direction:column;
    gap:14px;
}

.btn{
    width:100%;

    padding:16px;

    border:none;
    border-radius:22px;

    background:rgba(79,140,255,0.12);

    color:var(--text);

    font-size:15px;
    font-weight:600;

    border:1px solid rgba(79,140,255,0.18);

    cursor:pointer;

    transition:.25s;
}

.btn:hover{
    transform:translateY(-3px);
    background:var(--accent);
    color:white;
}

/* OUTPUT */

.output{
    margin-top:20px;

    padding:18px;

    border-radius:24px;

    background:rgba(255,255,255,0.03);

    border:1px solid var(--border);

    color:var(--sub);

    min-height:78px;

    display:flex;
    align-items:center;
    justify-content:center;

    text-align:center;

    font-size:14px;
    line-height:1.7;

    transition:.25s;
}

body.light .output{
    background:#f8fafc;
}

/* BACK */

.back{
    width:100%;

    margin-top:18px;

    padding:16px;

    border:none;
    border-radius:22px;

    background:var(--text);
    color:var(--bg);

    font-weight:600;

    cursor:pointer;

    transition:.25s;
}

.back:hover{
    transform:translateY(-3px);
    opacity:.92;
}

/* MOBILE */

@media(max-width:500px){

    body{
        padding:14px;
        align-items:flex-end;
    }

    .container{
        max-width:100%;
        border-radius:30px 30px 0 0;
    }

    .title{
        font-size:20px;
    }

    .btn,
    .back{
        font-size:14px;
        padding:15px;
    }

    .output{
        font-size:13px;
    }
}

</style>
</head>

<body>

<div class="container">

    <div class="top">

        <div class="title">
            Dialog JavaScript
        </div>

        <div class="mode" onclick="toggleMode()">
            ☾
        </div>

    </div>

    <div class="group">

        <button class="btn" onclick="inputNama()">
            Input Nama
        </button>

        <button class="btn" onclick="tampilAlert()">
            Alert
        </button>

        <button class="btn" onclick="tampilConfirm()">
            Confirm
        </button>

    </div>

    <div class="output" id="output">
        Hasil akan muncul di sini
    </div>

    <button class="back" onclick="kembaliIndex()">
        Kembali ke Index
    </button>

</div>

<script>

const output = document.getElementById("output");

function tampil(teks){
    output.innerHTML = teks;
}

function inputNama(){

    let nama = prompt("Masukkan nama kamu");

    if(nama){
        tampil(`Halo, ${nama} 👋`);
    }else{
        tampil("Tidak ada input");
    }
}

function tampilAlert(){

    alert("Ini alert JavaScript");

    tampil("Alert berhasil ditampilkan");
}

function tampilConfirm(){

    let jawab = confirm("Suka JavaScript?");

    if(jawab){
        tampil("Jawaban: IYA 👍");
    }else{
        tampil("Jawaban: TIDAK 👎");
    }
}

function kembaliIndex(){
    window.location.href = "index.html";
}

function toggleMode(){
    document.body.classList.toggle("light");
}

</script>

</body>
</html>
