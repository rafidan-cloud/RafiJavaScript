<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Operator Lengkap</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg: linear-gradient(135deg,#1e1e1e,#3a3a3a);
  --card:#2a2a2a;
  --text:#fff;
  --primary:#4a90e2;
}

.light{
  --bg: linear-gradient(135deg,#e0e0e0,#ffffff);
  --card:#ffffff;
  --text:#222;
}

body{
  margin:0;
  font-family:'Poppins',sans-serif;
  background:var(--bg);
  color:var(--text);
  transition:0.3s;
}

/* NAVBAR */
nav{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:20px 30px;
}

.back{
  text-decoration:none;
  background:rgba(0,0,0,0.5);
  color:#fff;
  padding:8px 18px;
  border-radius:20px;
  font-size:14px;
}

.light .back{
  background:#ddd;
  color:#000;
}

.toggle{
  cursor:pointer;
  background:rgba(0,0,0,0.5);
  padding:8px 18px;
  border-radius:20px;
}

/* CONTAINER */
.container{
  max-width:700px;
  margin:auto;
  text-align:center;
  padding:20px;
}

/* TITLE */
h1{
  margin-top:10px;
}

/* MENU */
.menu{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
  margin-top:30px;
}

.btn{
  background:var(--card);
  padding:35px;
  border-radius:20px;
  cursor:pointer;
  font-size:16px;
  box-shadow:0 10px 25px rgba(0,0,0,0.3);
  transition:0.3s;
}

.btn:hover{
  transform:translateY(-6px);
  background:var(--primary);
  color:#fff;
}

/* RESULT CARD */
.result{
  margin-top:30px;
  background:var(--card);
  padding:20px;
  border-radius:20px;
  box-shadow:0 10px 25px rgba(0,0,0,0.3);
  opacity:0;
  transform:translateY(20px);
  transition:0.4s;
}

.result.show{
  opacity:1;
  transform:translateY(0);
}

/* TABLE */
table{
  width:100%;
  border-collapse:collapse;
  margin-top:10px;
}

th,td{
  padding:10px;
  border-bottom:1px solid #ccc;
  text-align:center;
}
</style>
</head>

<body>

<nav>
  <a href="index.html" class="back">⬅ Kembali ke Index</a>
  <div class="toggle" onclick="mode()">🌙 / ☀️</div>
</nav>

<div class="container">

<h1>Operator JavaScript</h1>
<p>Pilih jenis operator yang ingin kamu jalankan</p>

<div class="menu">
  <div class="btn" onclick="variabel()">📊 Operator Variabel</div>
  <div class="btn" onclick="logika()">🧠 Operator Logika</div>
</div>

<div id="hasil" class="result"></div>

</div>

<script>
function mode(){
  document.body.classList.toggle("light");
}

/* VARIABEL */
function variabel(){
  let x = Number(prompt("Masukkan nilai awal:"));

  let html = `
  <h3>Operator Variabel</h3>
  <table>
  <tr><th>Langkah</th><th>Operasi</th><th>Hasil</th></tr>
  <tr><td>Awal</td><td>x</td><td>${x}</td></tr>
  `;

  x+=11; html+=`<tr><td>1</td><td>x += 11</td><td>${x}</td></tr>`;
  x-=4; html+=`<tr><td>2</td><td>x -= 4</td><td>${x}</td></tr>`;
  x*=3; html+=`<tr><td>3</td><td>x *= 3</td><td>${x}</td></tr>`;
  x/=5; html+=`<tr><td>4</td><td>x /= 5</td><td>${x}</td></tr>`;
  x**=3; html+=`<tr><td>5</td><td>x **= 3</td><td>${x}</td></tr>`;
  x%=6; html+=`<tr><td>6</td><td>x %= 6</td><td>${x}</td></tr>`;

  html+=`<tr><td colspan="2"><b>Nilai Akhir</b></td><td>${x}</td></tr></table>`;

  tampil(html);
}

/* LOGIKA */
function logika(){
  let a = Number(prompt("Nilai A:"));
  let b = Number(prompt("Nilai B:"));

  let aPos = a>0;
  let bPos = b>0;
  let xor = (aPos||bPos)&&!(aPos&&bPos);

  let html = `
  <h3>Operator Logika</h3>
  <table>
  <tr><th>Keterangan</th><th>Hasil</th></tr>
  <tr><td>A</td><td>${a}</td></tr>
  <tr><td>B</td><td>${b}</td></tr>
  <tr><td>A > B</td><td>${a>b}</td></tr>
  <tr><td>A == B</td><td>${a==b}</td></tr>
  <tr><td>AND</td><td>${aPos&&bPos}</td></tr>
  <tr><td>OR</td><td>${aPos||bPos}</td></tr>
  <tr><td>NOT A</td><td>${!aPos}</td></tr>
  <tr><td>XOR</td><td>${xor}</td></tr>
  </table>
  `;

  tampil(html);
}

/* SHOW RESULT */
function tampil(html){
  let el = document.getElementById("hasil");
  el.innerHTML = html;
  el.classList.add("show");
}
</script>

</body>
</html>
